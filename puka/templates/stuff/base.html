{% extends "base.html" %}

{% block title %}Stuff{% endblock %}

{% block menu %}
    <div class="font-semibold text-neutral-content/60">Tasks</div>
    {% partial menu-partial %}
{% endblock menu %}

{% partialdef menu-partial %}
    <ul
        hx-swap-oob="true"
        id="id_extra_menu"
        role="list"
        class="menu -mx-2 mt-2"
    >
        <c-layout.nav-item
            url_name="stuff:location-list"
            :arg="0"
            match="/stuff/location/"
            target="#content"
            x-on:click="$refs.sidebarDrawer.checked = false"
        >Locations</c-layout.nav-item>
    </ul>
{% endpartialdef menu-partial %}
