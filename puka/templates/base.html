{% extends "root.html" %}
{% load static %}

{% block root %}
    <c-layout.drawer id="app-drawer">
        <c-layout.navbar drawer="app-drawer">
            <c-slot name="start">
                <div id="breadcrumbs" class="breadcrumbs text-sm font-semibold">
                    {% block breadcrumbs %}
                        <ul>
                            <li>Overview</li>
                        </ul>
                    {% endblock breadcrumbs %}
                </div>
            </c-slot>
            <c-slot name="end">
                <details class="dropdown dropdown-end">
                    <summary class="btn btn-ghost gap-2 px-2">
                        <span class="hidden text-sm font-medium text-base-content/80 sm:block">
                            {% firstof user.email user.get_username %}
                        </span>
                        <c-ui.icon name="hero-chevron-down" class="size-4 text-base-content/60" />
                    </summary>
                    <ul class="menu dropdown-content z-30 mt-2 w-56 rounded-box border border-base-200 bg-base-100 p-2 shadow">
                        <li class="menu-title"><span>Account</span></li>
                        <li>
                            <form action="{% url 'logout' %}" method="post">
                                {% csrf_token %}
                                <button type="submit" class="flex items-center gap-2">
                                    <c-ui.icon name="hero-arrow-left-on-rectangle" class="size-4" />
                                    Log out
                                </button>
                            </form>
                        </li>
                    </ul>
                </details>
            </c-slot>
        </c-layout.navbar>

        <main class="min-h-[calc(100vh-4rem)] bg-base-200 px-4 py-6 sm:px-6 lg:px-8">
            <div id="content" class="mx-auto w-full max-w-screen-2xl">
                {% block content %}{% endblock %}
            </div>
        </main>

        <c-slot name="side">
            <div class="min-h-full w-64 border-r border-base-300 bg-base-200 pt-16 backdrop-blur lg:pt-0">
                <div class="hidden h-16 items-center px-5 lg:flex">
                    <a href="{% url 'home' %}" class="flex h-full items-center gap-3">
                        <img src="{% static 'puka-logo.svg' %}" alt="Puka" class="h-auto w-[180px] max-w-full">
                    </a>
                </div>

                {% include "core/sidebar.html" %}
            </div>
        </c-slot>
    </c-layout.drawer>
{% endblock root %}
