{% comment %}One panel inside <c-ui.tabs>; shown when its `name` is active.{% endcomment %}
<c-vars name class />

<div
    role="tabpanel"
    class="mt-4 rounded-box border border-base-300 bg-base-100 p-4 sm:p-6 {{ class }}"
    x-show="isActive('{{ name|escapejs }}')"
    x-cloak
    {{ attrs }}
>
    {{ slot }}
</div>
