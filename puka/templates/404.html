{% extends "root.html" %}

{% block title %}Page not found{% endblock %}

{% block root %}
    <main class="grid min-h-screen place-items-center bg-base-200 px-6 py-24 sm:py-32 lg:px-8">
        <div class="text-center">
            <p class="text-base font-semibold text-primary">404</p>
            <h1 class="mt-4 text-5xl font-semibold tracking-tight text-balance sm:text-7xl">Page not found</h1>
            <p class="mt-6 text-lg font-medium text-pretty text-base-content/70 sm:text-xl/8">
                Sorry, we couldn’t find the page you’re looking for.
            </p>
            <div class="mt-10 flex items-center justify-center gap-x-6">
                <c-ui.button href="{% url 'home' %}" variant="primary" icon="hero-home">Go back home</c-ui.button>
            </div>
        </div>
    </main>
{% endblock root %}
