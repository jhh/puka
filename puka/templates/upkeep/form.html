{% extends "upkeep/base.html" %}

{% partialdef form-partial %}
    {# The form's own template (its template_name) lays out the fields and buttons. #}
    <c-ui.card>
        <c-form.form action="{{ request.path }}" :form="form">{{ form }}</c-form.form>
    </c-ui.card>
{% endpartialdef form-partial %}

{% block content %}
    {% partial form-partial %}
{% endblock content %}
