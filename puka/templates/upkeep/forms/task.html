{# TaskForm.template_name. #}
<div class="grid grid-cols-1 gap-x-6 gap-y-4 sm:grid-cols-6">
    <c-form.field :field="form.name" class="sm:col-span-6" />
    <c-form.field :field="form.area" class="sm:col-span-6" />
    <c-form.field :field="form.interval" class="sm:col-span-3" />
    <c-form.field :field="form.frequency" class="sm:col-span-3" />
    <c-form.field :field="form.notes" class="sm:col-span-6" />
</div>
{% if form.instance.pk %}{% url 'upkeep:task-delete' form.instance.pk as delete_url %}{% endif %}
<c-form.actions
    submit="Save task"
    cancel="{% url 'upkeep:task-list' %}"
    delete="{{ delete_url }}"
    confirm="Delete this task?"
/>
