{# TaskItemForm.template_name. #}
<div class="grid grid-cols-1 gap-x-6 gap-y-4 sm:grid-cols-6">
    <c-form.field :field="form.task" class="sm:col-span-6" />
    <c-form.field :field="form.item" class="sm:col-span-6" />
    <c-form.field :field="form.quantity" class="sm:col-span-3" />
</div>
{% if form.instance.pk %}{% url 'upkeep:task-item-delete' form.instance.pk as delete_url %}{% endif %}
<c-form.actions
    submit="Save item"
    cancel="{% url 'upkeep:home' %}"
    delete="{{ delete_url }}"
    confirm="Delete this item?"
/>
