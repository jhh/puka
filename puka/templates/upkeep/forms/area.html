{# AreaForm.template_name. #}
<c-form.fields :form="form" />
{% if form.instance.pk %}{% url 'upkeep:area-delete' form.instance.pk as delete_url %}{% endif %}
<c-form.actions
    submit="Save area"
    cancel="{% url 'upkeep:area-list' %}"
    delete="{{ delete_url }}"
    confirm="Delete this area?"
/>
